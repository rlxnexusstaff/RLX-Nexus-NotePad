<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NotePad online da RLX Nexus - Salve e compartilhe notas via link">
    <title>RLX Nexus - NotePad</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Seu arquivo CSS separado -->
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <!-- ========== HEADER ========== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-custom fixed-top" role="navigation" aria-label="Navegação principal">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#"
                    aria-label="RLX Nexus - Página inicial">
                    <img src="content-removebg.png" alt="Logo RLX Nexus" loading="lazy">
                    <span>RLX Nexus</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="container main-container" style="padding-top: 50px;">

        <!-- Alert dinâmico -->
        <div id="alertBox" class="alert d-none mb-2 shadow-sm" role="alert" aria-live="polite" aria-atomic="true">
        </div>

        <!-- Hero -->
        <section class="home-hero" aria-label="Introdução">
            <h1 class="home-hero-title">NotePad Oficial da RLX Nexus</h1>
            <p class="home-hero-tagline">Suas notas seguras online, salvas e compartilhadas instantaneamente via link.</p>
        </section>

        <!-- Editor Compactado para Tela Fixa -->
        <section class="editor-card" aria-label="Editor de notas">
            <form id="note_form" aria-label="Formulário de edição de nota">

                <!-- Título -->
                <div class="mb-2">
                    <label for="edit_title" class="visually-hidden">Título da nota</label>
                    <input type="text" id="edit_title" class="form-control form-control-sm" placeholder="Título da Nota"
                        autocomplete="off" maxlength="200" aria-describedby="title-help">
                </div>

                <!-- Barra de ações -->
                <div class="mb-2 d-flex flex-wrap align-items-center justify-content-between gap-2 topLinks"
                    role="toolbar" aria-label="Ações da nota">
                    <div>
                        <a href="#" id="btn-new-note" role="button" aria-label="Criar nova nota" class="me-2">
                            <i class="bi bi-file-earmark-plus me-1" aria-hidden="true"></i>
                            <strong>Nova Nota</strong>
                        </a>
                        <a href="#" id="btn-share" role="button" aria-label="Compartilhar link da nota" class="me-2">
                            <i class="bi bi-share me-1" aria-hidden="true"></i>
                            <strong>Compartilhar Link</strong>
                        </a>
                        <a href="#" id="btn-download" role="button" aria-label="Baixar nota como arquivo de texto">
                            <i class="bi bi-download me-1" aria-hidden="true"></i>
                            <strong>Baixar .txt</strong>
                        </a>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <span id="char-counter" class="autosave-status">0 / 50.000 caracteres</span>
                        <button type="button" id="btn-theme-toggle" class="btn btn-outline-secondary" title="Alternar tema">
                            <span id="theme-icon">🌙</span>
                        </button>
                    </div>
                </div>

                <!-- Textarea (comportamento estilo chat do Discord) -->
                <div class="mb-2">
                    <label for="edit_textarea" class="visually-hidden">Conteúdo da nota</label>
                    <textarea id="edit_textarea" class="form-control textarea shadow-none"
                        placeholder="Escreva suas anotações aqui..." aria-describedby="char-count"></textarea>
                </div>

                <!-- Status autosave + Atalhos -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span id="autosave-status" class="autosave-status" aria-live="polite"></span>
                    <span class="shortcut-hint">
                        <kbd>Ctrl</kbd> + <kbd>S</kbd> para salvar &nbsp;|&nbsp;
                        <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>N</kbd> nova nota
                    </span>
                </div>

                <!-- Botão Salvar -->
                <div class="row align-items-center">
                    <div class="col-md-12 d-flex align-items-center gap-3">
                        <button type="submit" class="btn btn-primary shadow-sm" id="btn-save">
                            <i class="bi bi-save me-1" aria-hidden="true"></i> Salvar Nota
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <!-- ========== MODAL DE CONFIRMAÇÃO PERSONALIZADO ========== -->
    <div class="modal fade" id="customConfirmModal" tabindex="-1" aria-labelledby="customConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="customConfirmModalLabel">Confirmação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body py-3" id="customConfirmModalBody">
                    Tem certeza de que deseja realizar esta ação?
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal" id="modalBtnCancel">Cancelar</button>
                    <button type="button" class="btn btn-primary px-4" id="modalBtnConfirm">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

    <!-- Arquivo principal como módulo -->
    <script type="module" src="app.js"></script>

</body>

</html>
